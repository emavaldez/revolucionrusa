<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky1919" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1010"/>
      <stop offset="50%" style="stop-color:#2a1a1a"/>
      <stop offset="100%" style="stop-color:#3a2a1a"/>
    </linearGradient>
    <linearGradient id="ground1919" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a1a"/>
      <stop offset="100%" style="stop-color:#1a1005"/>
    </linearGradient>
    <filter id="glow1919">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1919)"/>
  <!-- Smoke clouds -->
  <ellipse cx="400" cy="200" rx="120" ry="40" fill="#444" opacity="0.15"/>
  <ellipse cx="500" cy="160" rx="100" ry="35" fill="#555" opacity="0.1"/>
  <ellipse cx="600" cy="130" rx="80" ry="25" fill="#666" opacity="0.08"/>
  <ellipse cx="1400" cy="180" rx="150" ry="50" fill="#444" opacity="0.12"/>
  <ellipse cx="1550" cy="140" rx="120" ry="40" fill="#555" opacity="0.1"/>
  <!-- Ground -->
  <rect y="520" width="1920" height="560" fill="url(#ground1919)"/>
  <!-- Rails -->
  <rect x="0" y="700" width="1920" height="12" fill="#222" stroke="#333" stroke-width="2"/>
  <rect x="0" y="850" width="1920" height="12" fill="#222" stroke="#333" stroke-width="2"/>
  <!-- Sleepers -->
  <rect x="100" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="300" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="500" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="700" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="900" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="1100" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="1300" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="1500" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="1700" y="690" width="40" height="180" fill="#1a1005" stroke="#2a1a0a" stroke-width="1"/>
  <!-- Train body -->
  <rect x="150" y="300" width="1600" height="350" fill="#0d0d0d" stroke="#222" stroke-width="3"/>
  <rect x="180" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="420" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="660" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="900" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="1140" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <rect x="1380" y="330" width="200" height="200" fill="#111" stroke="#333" stroke-width="2"/>
  <!-- Train roof -->
  <polygon points="150,300 950,220 1750,300" fill="#080808" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Chimney -->
  <rect x="1550" y="180" width="60" height="120" fill="#111" stroke="#333" stroke-width="2"/>
  <polygon points="1540,180 1580,120 1620,180" fill="#0a0a0a" stroke="#222" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="280" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="280" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="520" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="520" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="760" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="760" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="1000" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="1000" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="1240" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="1240" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="1480" cy="650" r="50" fill="#0a0a0a" stroke="#222" stroke-width="4"/>
  <circle cx="1480" cy="650" r="30" fill="#111" stroke="#333" stroke-width="2"/>
  <!-- Red star on train -->
  <polygon points="950,420 960,450 990,450 965,470 975,500 950,480 925,500 935,470 910,450 940,450" fill="#be1111" opacity="0.8"/>
  <!-- Searchlight -->
  <circle cx="160" cy="380" r="25" fill="#ffcc00" opacity="0.3" filter="url(#glow1919)"/>
  <circle cx="160" cy="380" r="12" fill="#ffeeaa" opacity="0.6" filter="url(#glow1919)"/>
  <!-- Distant mountains -->
  <polygon points="0,520 200,400 400,520" fill="#1a0f0f" opacity="0.6"/>
  <polygon points="300,520 600,350 900,520" fill="#150a0a" opacity="0.5"/>
  <polygon points="1100,520 1400,380 1700,520" fill="#1a0f0f" opacity="0.6"/>
  <polygon points="1500,520 1800,420 1920,520" fill="#150a0a" opacity="0.5"/>
  <!-- Text -->
  <text x="960" y="100" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="28" opacity="0.7" letter-spacing="4">TREN BLINDADO</text>
  <text x="960" y="130" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="16" opacity="0.5" letter-spacing="6">1919 · FRENTE ORIENTAL</text>
</svg>