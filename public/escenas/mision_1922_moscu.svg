<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky1922" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a2a3e"/>
    </linearGradient>
    <linearGradient id="floor1922" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2020"/>
      <stop offset="100%" style="stop-color:#1a1010"/>
    </linearGradient>
    <filter id="glow1922">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1922)"/>
  <!-- Chandelier glow -->
  <circle cx="960" cy="150" r="80" fill="#ffce00" opacity="0.1" filter="url(#glow1922)"/>
  <circle cx="960" cy="150" r="40" fill="#ffeeaa" opacity="0.2" filter="url(#glow1922)"/>
  <!-- Chandelier -->
  <line x1="960" y1="0" x2="960" y2="120" stroke="#444" stroke-width="3"/>
  <ellipse cx="960" cy="130" rx="80" ry="15" fill="#333" stroke="#555" stroke-width="2"/>
  <ellipse cx="960" cy="145" rx="60" ry="10" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="920" cy="155" r="6" fill="#ffeeaa" opacity="0.6" filter="url(#glow1922)"/>
  <circle cx="960" cy="165" r="6" fill="#ffeeaa" opacity="0.6" filter="url(#glow1922)"/>
  <circle cx="1000" cy="155" r="6" fill="#ffeeaa" opacity="0.6" filter="url(#glow1922)"/>
  <!-- Floor -->
  <rect y="600" width="1920" height="480" fill="url(#floor1922)"/>
  <!-- Stage/Carpet -->
  <rect x="300" y="600" width="1320" height="80" fill="#3a1515" stroke="#4a2020" stroke-width="2"/>
  <!-- Theater building -->
  <rect x="350" y="180" width="1220" height="420" fill="#0d0d1a" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Columns -->
  <rect x="420" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="620" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="820" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="1020" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="1220" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <rect x="1420" y="200" width="60" height="400" fill="#111" stroke="#222" stroke-width="2"/>
  <!-- Arch top -->
  <polygon points="350,180 960,80 1570,180" fill="#08080f" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Stage curtain left -->
  <path d="M 300,600 Q 350,400 300,200" fill="#5a0a0a" stroke="#6a1515" stroke-width="2" opacity="0.9"/>
  <path d="M 300,600 Q 320,450 300,300" fill="#4a0808" stroke="#5a1010" stroke-width="1" opacity="0.8"/>
  <!-- Stage curtain right -->
  <path d="M 1620,600 Q 1570,400 1620,200" fill="#5a0a0a" stroke="#6a1515" stroke-width="2" opacity="0.9"/>
  <path d="M 1620,600 Q 1600,450 1620,300" fill="#4a0808" stroke="#5a1010" stroke-width="1" opacity="0.8"/>
  <!-- Red banner -->
  <rect x="600" y="650" width="720" height="50" fill="#be1111" opacity="0.85"/>
  <rect x="620" y="665" width="680" height="20" fill="#ffce00" opacity="0.3"/>
  <!-- Podium -->
  <rect x="880" y="520" width="160" height="80" fill="#1a1005" stroke="#2a1a0a" stroke-width="2"/>
  <rect x="900" y="480" width="120" height="40" fill="#111" stroke="#222" stroke-width="1"/>
  <!-- Seats -->
  <rect x="200" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="350" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="500" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1320" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1470" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1620" y="800" width="100" height="60" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <!-- Text -->
  <text x="960" y="100" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="28" opacity="0.7" letter-spacing="4">GRAN TEATRO DE MOSCÚ</text>
  <text x="960" y="130" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="16" opacity="0.5" letter-spacing="6">DICIEMBRE 1922 · FUNDACIÓN DE LA URSS</text>
</svg>
