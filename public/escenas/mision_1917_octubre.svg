<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky1917" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="60%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a1a1a"/>
    </linearGradient>
    <linearGradient id="snow1917" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3a"/>
      <stop offset="100%" style="stop-color:#1a1a25"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1917)"/>
  <!-- Stars -->
  <circle cx="200" cy="100" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="500" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="800" cy="120" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="1200" cy="60" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="1500" cy="90" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="1700" cy="130" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="100" cy="200" r="1" fill="#fff" opacity="0.3"/>
  <!-- Moon -->
  <circle cx="1600" cy="150" r="50" fill="#ffce00" opacity="0.15"/>
  <circle cx="1600" cy="150" r="40" fill="#ffce00" opacity="0.25"/>
  <!-- Ground -->
  <rect y="550" width="1920" height="530" fill="url(#snow1917)"/>
  <!-- Palace silhouette -->
  <rect x="150" y="250" width="400" height="350" fill="#0d0d1a" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="200" y="300" width="100" height="140" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="380" y="300" width="100" height="140" fill="#111" stroke="#222" stroke-width="1"/>
  <polygon points="150,250 350,140 550,250" fill="#0a0a15" stroke="#1a1a2e" stroke-width="2"/>
  <polygon points="200,300 250,240 300,300" fill="#0d0d1a" stroke="#222" stroke-width="1"/>
  <polygon points="380,300 430,240 480,300" fill="#0d0d1a" stroke="#222" stroke-width="1"/>
  <!-- Main palace body -->
  <rect x="700" y="180" width="600" height="420" fill="#080810" stroke="#1a1a25" stroke-width="3"/>
  <rect x="750" y="240" width="120" height="200" fill="#0d0d1a" stroke="#222" stroke-width="1"/>
  <rect x="940" y="240" width="120" height="200" fill="#0d0d1a" stroke="#222" stroke-width="1"/>
  <rect x="1130" y="240" width="120" height="200" fill="#0d0d1a" stroke="#222" stroke-width="1"/>
  <polygon points="700,180 1000,80 1300,180" fill="#06060c" stroke="#1a1a25" stroke-width="2"/>
  <!-- Columns -->
  <rect x="780" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <rect x="820" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <rect x="970" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <rect x="1010" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <rect x="1160" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <rect x="1200" y="240" width="20" height="200" fill="#111" opacity="0.8"/>
  <!-- Lanterns with warm glow -->
  <circle cx="700" cy="380" r="30" fill="#ffaa00" opacity="0.15" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="15" fill="#ffcc00" opacity="0.4" filter="url(#glow)"/>
  <rect x="695" y="340" width="10" height="40" fill="#333" stroke="#555" stroke-width="1"/>
  <line x1="700" y1="340" x2="700" y2="300" stroke="#444" stroke-width="2"/>
  <circle cx="1200" cy="340" r="30" fill="#ffaa00" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1200" cy="340" r="15" fill="#ffcc00" opacity="0.4" filter="url(#glow)"/>
  <rect x="1195" y="300" width="10" height="40" fill="#333" stroke="#555" stroke-width="1"/>
  <line x1="1200" y1="300" x2="1200" y2="260" stroke="#444" stroke-width="2"/>
  <circle cx="1800" cy="360" r="30" fill="#ffaa00" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1800" cy="360" r="15" fill="#ffcc00" opacity="0.4" filter="url(#glow)"/>
  <rect x="1795" y="320" width="10" height="40" fill="#333" stroke="#555" stroke-width="1"/>
  <line x1="1800" y1="320" x2="1800" y2="280" stroke="#444" stroke-width="2"/>
  <!-- Trees -->
  <polygon points="100,550 130,400 160,550" fill="#0d0d15" stroke="#1a1a25" stroke-width="1"/>
  <polygon points="140,550 170,420 200,550" fill="#0a0a12" stroke="#1a1a25" stroke-width="1"/>
  <polygon points="1700,550 1730,380 1760,550" fill="#0d0d15" stroke="#1a1a25" stroke-width="1"/>
  <polygon points="1750,550 1780,400 1810,550" fill="#0a0a12" stroke="#1a1a25" stroke-width="1"/>
  <!-- Fence -->
  <rect x="0" y="520" width="1920" height="8" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="100" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="300" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="500" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1300" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1500" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <rect x="1700" y="500" width="8" height="30" fill="#111" stroke="#222" stroke-width="1"/>
  <!-- Text -->
  <text x="960" y="100" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="28" opacity="0.7" letter-spacing="4">PALACIO DE INVIERNO</text>
  <text x="960" y="130" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="16" opacity="0.5" letter-spacing="6">OCTUBRE 1917 · PETROGRADO</text>
</svg>