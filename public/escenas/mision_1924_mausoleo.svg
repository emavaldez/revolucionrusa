<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky1924" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d15"/>
      <stop offset="50%" style="stop-color:#1a1a25"/>
      <stop offset="100%" style="stop-color:#2a1a1a"/>
    </linearGradient>
    <linearGradient id="snow1924" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a35"/>
      <stop offset="100%" style="stop-color:#15151a"/>
    </linearGradient>
    <filter id="glow1924">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky1924)"/>
  <!-- Stars -->
  <circle cx="300" cy="100" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="700" cy="80" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="1100" cy="110" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="1500" cy="70" r="1.5" fill="#fff" opacity="0.5"/>
  <!-- Moon -->
  <circle cx="1700" cy="120" r="35" fill="#ffeeaa" opacity="0.2"/>
  <circle cx="1700" cy="120" r="25" fill="#ffeeaa" opacity="0.3"/>
  <!-- Ground -->
  <rect y="580" width="1920" height="500" fill="url(#snow1924)"/>
  <!-- Mausoleum -->
  <rect x="700" y="200" width="600" height="350" fill="#08080c" stroke="#1a1a20" stroke-width="3"/>
  <rect x="750" y="250" width="120" height="200" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <rect x="950" y="250" width="120" height="200" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <rect x="1150" y="250" width="120" height="200" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <!-- Pyramid roof -->
  <polygon points="700,200 1000,80 1300,200" fill="#06060a" stroke="#1a1a20" stroke-width="3"/>
  <!-- Steps -->
  <rect x="680" y="550" width="640" height="15" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <rect x="660" y="565" width="680" height="15" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <rect x="640" y="580" width="720" height="15" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <rect x="620" y="595" width="760" height="15" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <!-- Red flag / eternal flame -->
  <rect x="980" y="500" width="40" height="60" fill="#be1111" opacity="0.7" filter="url(#glow1924)"/>
  <polygon points="980,500 1000,460 1020,500" fill="#be1111" opacity="0.8" filter="url(#glow1924)"/>
  <circle cx="1000" cy="520" r="20" fill="#ff4400" opacity="0.3" filter="url(#glow1924)"/>
  <circle cx="1000" cy="520" r="10" fill="#ff8800" opacity="0.5" filter="url(#glow1924)"/>
  <!-- Workers silhouettes -->
  <ellipse cx="500" cy="560" rx="20" ry="40" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <circle cx="500" cy="515" r="12" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <ellipse cx="550" cy="565" rx="18" ry="38" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <circle cx="550" cy="522" r="11" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <ellipse cx="1400" cy="560" rx="20" ry="40" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <circle cx="1400" cy="515" r="12" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <ellipse cx="1450" cy="565" rx="18" ry="38" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <circle cx="1450" cy="522" r="11" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <!-- Trees -->
  <polygon points="200,580 230,420 260,580" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <polygon points="250,580 280,450 310,580" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <polygon points="1600,580 1630,430 1660,580" fill="#0a0a0f" stroke="#1a1a15" stroke-width="1"/>
  <polygon points="1650,580 1680,460 1710,580" fill="#08080a" stroke="#1a1a15" stroke-width="1"/>
  <!-- Kremlin wall hint -->
  <rect x="0" y="400" width="300" height="180" fill="#0a0a0f" stroke="#1a1a15" stroke-width="2"/>
  <rect x="50" y="420" width="40" height="120" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <rect x="150" y="420" width="40" height="120" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <polygon points="0,400 150,320 300,400" fill="#08080c" stroke="#1a1a15" stroke-width="2"/>
  <rect x="1620" y="400" width="300" height="180" fill="#0a0a0f" stroke="#1a1a15" stroke-width="2"/>
  <rect x="1670" y="420" width="40" height="120" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <rect x="1770" y="420" width="40" height="120" fill="#0d0d12" stroke="#1a1a20" stroke-width="1"/>
  <polygon points="1620,400 1770,320 1920,400" fill="#08080c" stroke="#1a1a15" stroke-width="2"/>
  <!-- Text -->
  <text x="960" y="80" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="28" opacity="0.7" letter-spacing="4">PLAZA ROJA</text>
  <text x="960" y="110" text-anchor="middle" fill="#ffce00" font-family="serif" font-size="16" opacity="0.5" letter-spacing="6">ENERO 1924 · MAUSOLEO EN CONSTRUCCIÓN</text>
</svg>